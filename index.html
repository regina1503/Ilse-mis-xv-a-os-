    <script>
        const container = document.getElementById('pageContainer');
        const dots = document.querySelectorAll('.dot-indicator');
        const totalPages = 9;
        let currentPage = 0;
        let isCoverMode = false;

        // Scroll listener to update active page indicators
        container.addEventListener('scroll', () => {
            const pageHeight = window.innerHeight;
            const newPage = Math.round(container.scrollTop / pageHeight);

            if (newPage !== currentPage && newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                updateUI();
            }
        });

        // Function to scroll to specific page index
        function scrollToPage(index) {
            currentPage = index;
            container.scrollTo({
                top: index * window.innerHeight,
                behavior: 'smooth'
            });
            updateUI();
        }

        // Previous page button
        function scrollToPrev() {
            if (currentPage > 0) {
                scrollToPage(currentPage - 1);
            }
        }

        // Next page button
        function scrollToNext() {
            if (currentPage < totalPages - 1) {
                scrollToPage(currentPage + 1);
            }
        }

        // Update dot states
        function updateUI() {
            dots.forEach((dot, idx) => {
                if (idx === currentPage) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        // Keyboard navigation (Up/Down arrow keys & PageUp/PageDown)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'PageDown') {
                e.preventDefault();
                scrollToNext();
            } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                e.preventDefault();
                scrollToPrev();
            }
        });

        // Initialize on load
        window.onload = function() {
            updateUI();
            initAudioPlayer();
            startCountdown();
        };

        const audio = document.getElementById('audioPlayer');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progressBar');
        const audioTime = document.getElementById('audioTime');

        function initAudioPlayer() {
            if (!audio) return;
            audio.addEventListener('timeupdate', updateAudioProgress);
            audio.addEventListener('ended', () => {
                playIcon.className = 'fa-solid fa-play text-lg translate-x-0.5';
                progressBar.style.width = '0%';
            });
        }

        function togglePlayPause() {
            if (!audio) return;
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.className = 'fa-solid fa-pause text-lg';
                }).catch(err => {
                    console.log('Audio playback prevented:', err);
                });
            } else {
                audio.pause();
                playIcon.className = 'fa-solid fa-play text-lg translate-x-0.5';
            }
        }

        function updateAudioProgress() {
            if (!audio || !audio.duration) return;
            const percentage = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${percentage}%`;
            
            const mins = Math.floor(audio.currentTime / 60);
            const secs = Math.floor(audio.currentTime % 60);
            audioTime.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function seekAudio(e) {
            if (!audio || !audio.duration) return;
            const container = document.getElementById('progressContainer');
            const rect = container.getBoundingClientRect();
            const clickPosition = (e.clientX - rect.left) / rect.width;
            audio.currentTime = clickPosition * audio.duration;
        }

        function startCountdown() {
            function getTargetDate() {
                // Target date set to 13 de Noviembre de 2026, 3:00 PM (15:00 hrs)
                return new Date(2026, 10, 13, 15, 0, 0);
            }

            const targetDate = getTargetDate();

            function updateTimer() {
                const now = new Date();
                const diff = targetDate - now;

                if (diff <= 0) {
                    document.getElementById('cd-days').innerText = '00';
                    document.getElementById('cd-hours').innerText = '00';
                    document.getElementById('cd-minutes').innerText = '00';
                    document.getElementById('cd-seconds').innerText = '00';
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / (1000 * 60)) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                document.getElementById('cd-days').innerText = String(days).padStart(2, '0');
                document.getElementById('cd-hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('cd-minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('cd-seconds').innerText = String(seconds).padStart(2, '0');
            }

            updateTimer();
            setInterval(updateTimer, 1000);
        }

        /* Logic for Step-by-Step RSVP Form */
        let currentStep = 1;
        let isAttending = true;
        let guestCountValue = 1;

        function goToStep(step) {
            if (step === 2) {
                const nameInput = document.getElementById('guestName');
                if (!nameInput.value.trim()) {
                    nameInput.reportValidity();
                    return;
                }
            }

            currentStep = step;
            document.querySelectorAll('.step-content').forEach((el, idx) => {
                if (idx + 1 === step) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            });

            const dots = document.querySelectorAll('#stepIndicators .step-dot');
            dots.forEach((dot, idx) => {
                if (idx + 1 <= step) {
                    dot.classList.remove('bg-white/30');
                    dot.classList.add('bg-[#780c15]');
                } else {
                    dot.classList.remove('bg-[#780c15]');
                    dot.classList.add('bg-white/30');
                }
            });
        }

        function selectAttendance(attending) {
            isAttending = attending;
            const yesBtn = document.getElementById('btnAttendingYes');
            const noBtn = document.getElementById('btnAttendingNo');

            if (attending) {
                yesBtn.className = "py-2 px-2 rounded-xl border border-white/40 bg-[#780c15] text-xs text-white font-medium transition-all flex flex-col items-center gap-1";
                noBtn.className = "py-2 px-2 rounded-xl border border-white/30 bg-black/40 text-xs text-white font-medium hover:bg-[#780c15] transition-all flex flex-col items-center gap-1";
            } else {
                noBtn.className = "py-2 px-2 rounded-xl border border-white/40 bg-[#780c15] text-xs text-white font-medium transition-all flex flex-col items-center gap-1";
                yesBtn.className = "py-2 px-2 rounded-xl border border-white/30 bg-black/40 text-xs text-white font-medium hover:bg-[#780c15] transition-all flex flex-col items-center gap-1";
            }
        }

        function changeGuests(delta) {
            guestCountValue = Math.max(1, Math.min(10, guestCountValue + delta));
            document.getElementById('guestCount').innerText = guestCountValue;
        }

        function handleRsvpSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('guestName').value.trim();
            const attendanceText = isAttending ? "Sí, con gusto asistiré 🎉" : "Lamentablemente no podré asistir 😔";
            const message = `¡Hola! Confirmo asistencia para los XV años de Ilse:\n\n👤 *Nombre:* ${name}\n✨ *Asistencia:* ${attendanceText}\n👥 *Número de personas:* ${guestCountValue}`;
            
            const whatsappUrl = `https://api.whatsapp.com/send?phone=526641941434&text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
